[package]
name = "rustcat-tauri"
version = "0.1.0"
description = "A running cat in the system tray, paced by a system metric"
authors = ["you"]
license = "MIT"
repository = "https://github.com/qidu/rustcat-tauri"
edition = "2024"
rust-version = "1.90"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# A library first: `RustCat::builder()` is the product, and `src/main.rs` is a
# thin demo bin that calls it — `cargo run` still launches the cat. The crate
# types are what Tauri needs to link the app on every platform it targets.
[lib]
name = "rustcat_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `tray-icon` puts the cat in the menu bar / notification area.
# `image-png` gives `Image::from_bytes` the PNG decoder it needs to bake in the
# five cat frames; without it the frames can only be loaded from disk.
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
rustcat-metrics = { path = "../../rustcat-metrics", default-features = false, features = ["cpu", "memory"] }
